# context
server.servlet.context-path=/answers-storage/api/v1
server.port=8089
# Swagger UI is served at /swagger-ui/index.html under the context path
# DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url=jdbc:postgresql://localhost:5432/answers-storage
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.format_sql=true
spring.cloud.refresh.enabled=false
spring.jmx.enabled=false
management.health.refresh.enabled=false
management.endpoints.web.exposure.include=health
security.require-ssl=false
javax.net.debug=ssl
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
