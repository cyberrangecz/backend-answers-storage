# context
server.servlet.context-path=/answers-storage/api/v1
server.port=8087
server.max-http-request-header-size=40KB

# DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url=jdbc:postgresql://{postgres-host}:5432/{database-name}
spring.datasource.username={database-username}
spring.datasource.password={database-password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}

# ACTUATOR: only the health endpoint is exposed
management.endpoints.web.exposure.include=health
